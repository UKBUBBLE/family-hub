<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E8EEF0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Family Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EEF0; --surface:#FFFFFF; --surface-2:#F3F6F7;
  --ink:#16252E; --ink-2:#4A5B65; --ink-3:#7D8D96;
  --line:#D3DCE0; --line-2:#E4EAEC;
  --cobalt:#2A46D6; --cobalt-ink:#1C34AE; --cobalt-soft:#E3E8FC;
  --yolk:#FFC23D; --yolk-ink:#6E4B00; --yolk-soft:#FFF1CC;
  --leaf:#1F9D66; --leaf-soft:#DCF2E6; --berry:#D33F57; --berry-soft:#FCE4E8;
  --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:9px;
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --pop:0 18px 50px rgba(22,37,46,.2);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.sm{font-size:14px}.xs{font-size:12.5px}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}

/* ---------- powłoka aplikacji ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px 18px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 22px;font-weight:700;font-size:19px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--cobalt);color:#fff;display:grid;place-items:center;flex:none}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);color:var(--ink-2);font-weight:500;width:100%}
.nav:hover{background:rgba(255,255,255,.55);color:var(--ink)}
.nav.active{background:var(--surface);color:var(--cobalt-ink);font-weight:600;box-shadow:0 0 0 1px var(--line-2)}
.nav .count{margin-left:auto;background:var(--yolk);color:var(--yolk-ink);font-size:12px;font-weight:700;border-radius:99px;padding:1px 8px}
.railFoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.openPanel{display:flex;align-items:center;gap:10px;padding:14px;border-radius:var(--r-lg);background:var(--ink);color:#fff;font-weight:600;width:100%}
.ver{font-size:12.5px;color:var(--ink-3);padding:0 12px}
.langSw{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.6)}.langSw button{width:100%;text-align:center;padding:8px 6px;font-size:14px}
.main{padding:28px clamp(16px,3vw,40px) 48px;max-width:1500px;width:100%;margin:0 auto;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:34px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em}
.head p{margin:6px 0 0;color:var(--ink-2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-md);font-weight:600;white-space:nowrap;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink)}
.btn:hover{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.btn.pri{background:var(--cobalt);color:#fff;box-shadow:none}.btn.pri:hover{background:var(--cobalt-ink)}
.btn.dark{background:var(--ink);color:#fff;box-shadow:none}
.btn.yolk{background:var(--yolk);color:var(--yolk-ink);box-shadow:none}
.btn.leaf{background:var(--leaf);color:#fff;box-shadow:none}
.btn.danger{color:var(--berry)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:var(--r-sm)}
.btn.icon{width:44px;padding:0}
.btn.icon.sm{width:36px}
.link{color:var(--cobalt-ink);font-weight:600}
.sect{background:var(--surface);border-radius:var(--r-xl);padding:20px 22px}
.sect h2{font-size:19px;margin:0 0 14px}
.sectHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sectHead h2{margin:0}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.cols.even{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-md);background:var(--surface-2);min-height:56px;width:100%}
button.row:hover{background:var(--cobalt-soft)}
.row .grow{flex:1;min-width:0}
.row b{font-weight:500;display:block}
.row small{display:block;color:var(--ink-2);font-size:13.5px}
.empty{padding:18px;border-radius:var(--r-md);border:1.5px dashed var(--line);color:var(--ink-2);text-align:center;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:var(--surface-2);font-size:14px;font-weight:500;white-space:nowrap}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:15px;line-height:1}
.avatar.lg{width:56px;height:56px;font-size:24px}
.seg{display:inline-flex;background:var(--surface);border-radius:var(--r-md);padding:4px;gap:2px;flex-wrap:wrap}
.seg button{padding:9px 15px;border-radius:var(--r-sm);font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.bar{height:8px;border-radius:9px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--leaf)}
.tabs{display:none}

/* ---------- wstęga dnia ---------- */
.ribbon{background:var(--surface);border-radius:var(--r-xl);padding:30px 18px 8px}
.rbTrack{position:relative}
.rbGrid{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.rbGrid i{position:absolute;top:-6px;bottom:-6px;width:1px;background:var(--line-2)}
.rbPast{position:absolute;left:0;top:-6px;bottom:-6px;background:repeating-linear-gradient(135deg,rgba(125,141,150,.11) 0 6px,transparent 6px 12px);border-radius:8px 0 0 8px;pointer-events:none}
.rbEv{position:absolute;height:38px;border-radius:10px;padding:3px 9px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;line-height:1.15;z-index:1}
.rbEv b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbEv small{font-size:11.5px;opacity:.88;white-space:nowrap;overflow:hidden}
.rbEv.past{opacity:.42}
.rbEv.tiny{padding:0}.rbEv.tiny b,.rbEv.tiny small{display:none}
.rbNow{position:absolute;top:-10px;bottom:-8px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:3px;z-index:3;pointer-events:none}
.rbNow span{position:absolute;top:-21px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:1px 7px;border-radius:7px}
.rbLeave{position:absolute;top:-10px;bottom:-8px;border-left:2px dashed #D19A1B;z-index:2;pointer-events:none}
.rbLeave span{position:absolute;top:-21px;left:-1px;background:var(--yolk);color:var(--yolk-ink);font-size:12px;font-weight:600;padding:1px 7px;border-radius:7px;white-space:nowrap}
.rbEmpty{position:absolute;top:0;right:0;bottom:0;left:0;display:grid;place-items:center;color:var(--ink-3);font-size:14px}
.rbHours{position:relative;height:22px;margin-top:10px}
.rbHours span{position:absolute;transform:translateX(-50%);font-size:12px;color:var(--ink-3)}
.rbHours span:first-child{transform:none}.rbHours span:last-child{transform:translateX(-100%)}
.rbAllDay{display:flex;gap:6px;flex-wrap:wrap;margin:-16px 0 12px}

/* ---------- kolumny osób (panel i zadania) ---------- */
.people{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:12px;min-height:0;overflow-x:auto;overscroll-behavior:contain}
.people.wrap{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pcol{display:flex;flex-direction:column;border-radius:var(--r-xl);overflow:hidden;min-height:0;background:var(--tint)}
.pcolHead{background:var(--pc);color:var(--on);padding:12px 14px 13px}
.pcolHead .top{display:flex;align-items:center;gap:10px}
.pcolHead .avatar{background:var(--on);color:var(--pc);width:40px;height:40px;font-size:20px;box-shadow:0 0 0 2px var(--on)}
.avatar{overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover;display:block}
button.avatar{cursor:pointer;transition:transform .12s}button.avatar:active{transform:scale(.9)}
.modal.wide{width:min(780px,100%)}
.tierHead{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;margin:18px 0 8px;font-size:16px}
.tierHead span{font-weight:500;font-size:14px;color:var(--ink-2)}
.avGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.av{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 9px;border-radius:var(--r-lg);background:var(--surface-2);position:relative;transition:transform .12s}
.av:active{transform:scale(.95)}
.av .pic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:32px;overflow:hidden;background:var(--surface);font-weight:700;line-height:1}
.av .pic img{width:100%;height:100%;object-fit:cover}
.av .price{font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.av.active{box-shadow:inset 0 0 0 3px var(--cobalt)}.av.active .price{color:var(--cobalt-ink)}
.av.buyable .price{color:var(--yolk-ink)}
.av.locked .pic{filter:grayscale(1);opacity:.45}.av.locked .price{color:var(--ink-3)}
.av.confirm{background:var(--yolk);box-shadow:none}.av.confirm .price{color:var(--yolk-ink)}
.photoPick{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bank{background:var(--surface);border-radius:var(--r-xl);padding:12px 14px;display:flex;align-items:center;gap:12px;min-width:0}
.bank .lbl{font-weight:600;font-size:16px;white-space:nowrap}
.bankRow{display:flex;gap:8px;overflow-x:auto;flex:1;padding:4px 2px;min-width:0}
.bchip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px 9px 10px;border-radius:99px;background:var(--surface-2);white-space:nowrap;font-weight:500;touch-action:pan-x;user-select:none;-webkit-user-select:none;cursor:grab;flex:none;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.bchip .e{font-size:21px;line-height:1}
.bchip .pt{font-size:12.5px;color:var(--ink-2);font-weight:600}
.bchip.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2);cursor:pointer}
.bchip.ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-70%) rotate(-3deg) scale(1.08);box-shadow:var(--pop);background:var(--surface)}
body.dragging,body.dragging *{cursor:grabbing!important}
body.dragging [data-drop]{outline:2px dashed rgba(22,37,46,.25);outline-offset:-3px}
body.dragging [data-drop].dropHover{outline:3px solid var(--ink);outline-offset:-3px}
#toast.act{pointer-events:auto}
.toastBtn{margin-left:14px;color:var(--yolk);font-weight:700;padding:4px 2px}
@media (max-width:700px){.bank{flex-wrap:wrap}.bankRow{flex-basis:100%}}
.pcolHead .name{font-weight:700;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcolHead .xp{font-weight:600;font-size:15px;white-space:nowrap}
.pcolHead .sub{font-size:13px;margin-top:2px;opacity:.9}
.goal{margin-top:10px;font-size:13.5px}
.goal .gt{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.goal .gt span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goalBar{height:7px;border-radius:9px;background:var(--barbg);overflow:hidden}
.goalBar i{display:block;height:100%;border-radius:9px;background:var(--on)}
.goalReady{margin-top:10px;width:100%;padding:9px 10px;border-radius:11px;background:var(--on);color:var(--pc);font-weight:700;text-align:center}
.pcolBody{padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;flex:1;overscroll-behavior:contain}
.routine{background:var(--surface);border-radius:var(--r-lg);padding:10px 10px 11px}
.routineHead{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;margin:0 3px 9px}
.routineHead .ok{color:var(--leaf)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.step{border-radius:13px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:7px 3px 6px;position:relative;border:2px solid transparent;min-height:70px;transition:transform .12s}
.step:active{transform:scale(.94)}
.step .emo{font-size:29px;line-height:1.1}
.step small{font-size:11px;color:var(--ink-2);line-height:1.15;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.done{background:var(--leaf-soft);border-color:var(--leaf)}
.step.done::after{content:"✓";position:absolute;top:2px;right:6px;color:var(--leaf);font-weight:700;font-size:14px}
.task{display:flex;align-items:center;gap:11px;min-height:58px;padding:9px 12px;border-radius:var(--r-lg);background:var(--surface);width:100%;transition:transform .12s}
.task:active{transform:scale(.97)}
.task .tick{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.task.done .tick{background:var(--leaf);border-color:var(--leaf);color:#fff}
.task.pending .tick{background:var(--yolk);border-color:var(--yolk);color:var(--yolk-ink)}
.task .t{flex:1;min-width:0}
.task b{display:block;font-weight:500;font-size:16px;line-height:1.25}
.task.done b{text-decoration:line-through;color:var(--ink-3)}
.task small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.task.late small{color:var(--berry);font-weight:500}
.task .pts{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.free{padding:16px 10px;text-align:center;color:var(--ink-2);font-size:14.5px}

/* ---------- panel ścienny ---------- */
body.panelMode .app{display:block}
body.panelMode .rail,body.panelMode .tabs{display:none!important}
body.panelMode .main{max-width:none;padding:0}
.panel{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px;padding:14px 16px 16px;overflow:hidden;user-select:none;-webkit-user-select:none}
.pHead{display:flex;align-items:center;gap:18px;min-width:0}
.pClock{font-size:62px;font-weight:700;letter-spacing:-.03em;line-height:.95}
.pDate{font-size:19px;font-weight:600}
.pWx{color:var(--ink-2);font-size:15px;margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wear{background:var(--surface);border-radius:99px;padding:2px 10px;font-size:14px;color:var(--ink)}
.spacer{flex:1}
.leavePill{display:flex;align-items:baseline;gap:8px;padding:9px 16px;border-radius:99px;background:var(--yolk);color:var(--yolk-ink);font-weight:500;white-space:nowrap}
.leavePill b{font-size:22px;font-weight:700}
.leavePill.calm{background:var(--yolk-soft)}
.leavePill.hot{background:var(--berry);color:#fff}
.leavePill.off{background:transparent;color:var(--ink-2);font-size:15px;padding:9px 6px}
.pMain{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;min-height:0}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.sideBox{background:var(--surface);border-radius:var(--r-xl);padding:14px 16px}
.sideBox h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sideBox h3 span{font-size:13px;font-weight:400;color:var(--ink-2)}
.prep{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line-2);font-size:15px;line-height:1.35}
.prep:first-of-type{border-top:0}
.prep .b{flex:none;width:22px;text-align:center}
.shopItem{display:flex;align-items:center;gap:10px;width:100%;padding:7px 0;border-top:1px solid var(--line-2);font-size:15px}
.shopItem:first-of-type{border-top:0}
.shopItem .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none}
.mealBtn{display:block;width:100%;font-size:17px;font-weight:500}
/* panel w pionie / węższy */
@media (max-width:1050px),(orientation:portrait){
  .pMain{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .side{flex-direction:row;overflow:visible}
  .side .sideBox{flex:1;min-width:0}
  .people{grid-auto-flow:row;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));overflow:auto}
  .pHead{flex-wrap:wrap;row-gap:8px}
  .pHead>div:nth-child(2){flex:1 1 280px}
}
@media (max-width:700px){
  .panel{height:auto;overflow:visible}
  .pHead{flex-wrap:wrap}
  .pClock{font-size:48px}
  .side{flex-direction:column}
  .people{grid-template-columns:1fr}
  .pcolBody{overflow:visible}
  .pHead .lbl{display:none}
  .rbHours span:nth-child(even){display:none}
}

/* ---------- noc i wygaszacz ---------- */
.night,.saver{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;cursor:pointer;z-index:5}
.night{background:#05080B;color:#7B8697}
.drift{position:absolute;transform:translate(-50%,-50%);text-align:center;transition:left 3s ease,top 3s ease;width:min(680px,90vw)}
.night .big{font-size:clamp(84px,14vw,170px);font-weight:300;letter-spacing:-.03em;line-height:1;color:#8C97A8}
.night .d{font-size:19px;color:#4C5666;margin-top:10px}
.night .nx{margin-top:22px;font-size:17px;line-height:1.6;color:#667082}
.night .nx b{color:#9AA4B5;font-weight:500}
.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:12.5px;color:#3A424F}
.saver{background:#0F1A20;color:#fff}
.saverImg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;animation:fadeIn 1.6s ease}
.saver::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.42),rgba(0,0,0,.08) 70%);pointer-events:none}
.saver .drift{z-index:2;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.saver .big{font-size:clamp(80px,12vw,150px);font-weight:600;letter-spacing:-.03em;line-height:1}
.saver .d{font-size:22px;font-weight:500;margin-top:8px}
.saver .nx{margin-top:16px;font-size:18px;opacity:.92}
.saver .hint{color:rgba(255,255,255,.55);z-index:2}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- modale, PIN, toast, konfetti ---------- */
.shade{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(22,37,46,.46);display:grid;place-items:center;padding:16px;z-index:50}
.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:var(--r-xl);padding:24px;box-shadow:var(--pop)}
.modal.narrow{width:min(380px,100%)}
.modal h2{margin:0 0 6px;font-size:24px;font-weight:700}
.modal .lead{margin:0 0 18px;color:var(--ink-2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--ink-2);min-width:0}
.f.full{grid-column:1/-1}
.f.check{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:15px}

@keyframes conf{0%{transform:translate(0,0) rotate(0)}45%{transform:translate(calc(var(--dx)*.7),var(--dy)) rotate(calc(var(--r)*.6));opacity:1}100%{transform:translate(var(--dx),calc(var(--dy)*.2 + 260px)) rotate(var(--r));opacity:0}}

<script>
(function() {
  function show(msg) {
    var go = function() {
      var d = document.getElementById("fhErr");
      if (!d) {
        d = document.createElement("div");
        d.id = "fhErr";
        d.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#D33F57;color:#fff;font:15px/1.4 sans-serif;padding:12px 16px;white-space:pre-wrap";
        document.body.appendChild(d);
      }
      d.textContent = "Family Hub – błąd / error:\n" + msg + "\n\n" + navigator.userAgent;
    };
    if (document.body) go();
    else document.addEventListener("DOMContentLoaded", go);
  }
  window.onerror = function(m, src, l, c, e) {
    show(m + " (l." + l + ":" + c + ")");
  };

document.addEventListener("submit", async (e) => {

        bad = true;
        continue;
      }
      const i = k.indexOf(":"), type = k.slice(0, i), id = k.slice(i + 1);
      if (type === "tier") {
        const t = ANIM_TIERS.concat(AV_TIERS).find((t2) => t2.name === id);
        if (t) {
          if (n === t.cost) delete s.avPrices[id];
          else s.avPrices[id] = n;
        }
      } else if (type === "reward") {
        const r = state.rewards.find((x) => x.id === id);
        if (r) r.cost = Math.max(1, n);
      } else if (type === "item") {
        const it = state.shopItems.find((x) => x.id === id);
        if (it) it.cost = n;
      } else if (type === "bank") {
        const b = state.bank.find((x) => x.id === id);
        if (b) b.points = n;
      } else if (type === "routine") {
        const r = state.routines.find((x) => x.id === id);
        if (r) r.points = n;

    return;
  }
  if (fid === "settingsForm") {
    const fd = new FormData(f), s = state.settings, pin = String(fd.get("pin") || "").trim();
    if (pin && !/^\d{4,6}$/.test(pin)) return toast("PIN musi mieć od 4 do 6 cyfr");

    if (pin) {
      s.parentPin = pin;
      unlockedUntil = Date.now() + 12e4;
    }
    save();
    render();
    toast("Ustawienia zapisane");
  }
});
